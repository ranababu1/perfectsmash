<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <!-- Adaptive icon foreground layer (108dp grid). The core and ball stay inside the 66dp safe
       circle centred at (54,54); only the motion streaks reach beyond it. -->
  <defs>
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff9aac"/>
      <stop offset="0.45" stop-color="#ff4566"/>
      <stop offset="1" stop-color="#b3123a"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.5" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#e59a12"/>
    </radialGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fff3b8"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The core, split by cracks radiating from the impact point -->
  <circle cx="62" cy="47" r="20" fill="url(#core)" stroke="#8c0d2e" stroke-width="1.4"/>
  <g fill="none" stroke="#1d2a9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 60 L56 50 L54 42 L61 32"/>
    <path d="M48 60 L61 55 L69 57 L78 50"/>
  </g>
  <ellipse cx="55" cy="38" rx="5.5" ry="3.2" transform="rotate(-35 55 38)" fill="#ffffff" opacity="0.55"/>

  <!-- Motion streaks behind the ball -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M27 84 L14 97" stroke-width="3" opacity="0.7"/>
    <path d="M24 77 L15 86" stroke-width="2.2" opacity="0.5"/>
  </g>

  <!-- Impact flash -->
  <circle cx="47" cy="61" r="11" fill="url(#flash)"/>
  <path d="M47 51 L49 58.5 L56 56 L50.5 61 L57 66 L49.5 63.5 L47 71 L44.5 63.5 L37 66 L43.5 61 L38 56 L44.5 58.5 Z" fill="#ffffff"/>

  <!-- The ball -->
  <circle cx="38" cy="70" r="11" fill="url(#ball)" stroke="#a8670a" stroke-width="1.3"/>
  <ellipse cx="34.5" cy="65.5" rx="3.6" ry="2.4" transform="rotate(-35 34.5 65.5)" fill="#ffffff" opacity="0.8"/>
</svg>

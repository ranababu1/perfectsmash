<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <!-- Adaptive icon background layer (108dp grid). Bright cobalt so the warm subject pops on any wallpaper. -->
  <defs>
    <radialGradient id="sky" cx="0.42" cy="0.58" r="0.75">
      <stop offset="0" stop-color="#6f9bff"/>
      <stop offset="0.45" stop-color="#3a62f0"/>
      <stop offset="1" stop-color="#1c2a9c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.435" cy="0.565" r="0.32">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="108" height="108" fill="url(#sky)"/>
  <!-- Soft rays bursting from the impact point (47,61). -->
  <g fill="#ffffff" opacity="0.10">
    <path d="M47 61 L20 -10 L40 -10 Z"/>
    <path d="M47 61 L75 -10 L100 -10 Z"/>
    <path d="M47 61 L130 20 L130 45 Z"/>
    <path d="M47 61 L130 85 L120 120 Z"/>
    <path d="M47 61 L70 130 L45 130 Z"/>
    <path d="M47 61 L-10 120 L-10 95 Z"/>
    <path d="M47 61 L-10 50 L-10 28 Z"/>
  </g>
  <rect width="108" height="108" fill="url(#glow)"/>
</svg>
